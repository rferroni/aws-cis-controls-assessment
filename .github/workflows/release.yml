name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"
        
    - name: Validate version format
      run: |
        if [[ ! "${{ steps.get_version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format: ${{ steps.get_version.outputs.version }}"
          exit 1
        fi

  pre-release-tests:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    needs: validate-tag
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev,test]
        
    - name: Run full test suite
      run: |
        pytest tests/ -v --cov=aws_cis_assessment --cov-report=xml
        
    - name: Run security scans
      run: |
        bandit -r aws_cis_assessment
        safety check
        
    - name: Validate package version
      run: |
        python -c "import aws_cis_assessment; print(f'Package version: {aws_cis_assessment.__version__}')"
        if [[ "$(python -c 'import aws_cis_assessment; print(aws_cis_assessment.__version__)')" != "${{ needs.validate-tag.outputs.version }}" ]]; then
          echo "Version mismatch between tag and package"
          exit 1
        fi

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [validate-tag, pre-release-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip build twine
        
    - name: Build source and wheel distributions
      run: |
        python -m build
        
    - name: Verify distributions
      run: |
        twine check dist/*
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-distributions
        path: dist/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build-artifacts]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-distributions
        path: dist/
        
    - name: Generate release notes
      id: release_notes
      run: |
        if [ -f CHANGELOG.md ]; then
          awk '/^## \['"${{ needs.validate-tag.outputs.version }}"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md
        else
          echo "Release ${{ needs.validate-tag.outputs.version }}" > release_notes.md
        fi
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.validate-tag.outputs.version }}
        name: Release v${{ needs.validate-tag.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: |
          dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [create-release]
    environment: release
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-distributions
        path: dist/
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true

  post-release:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create post-release issue
      uses: actions/github-script@v6
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Post-release tasks for v${{ needs.validate-tag.outputs.version }}`,
            body: `## Post-Release Checklist\n\n- [ ] Verify PyPI package: \`pip install aws-cis-controls-assessment==${{ needs.validate-tag.outputs.version }}\`\n- [ ] Update documentation if needed\n- [ ] Monitor for issues`,
            labels: ['release', 'task']
          });
